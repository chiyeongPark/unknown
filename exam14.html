<script>
    let number = prompt("점수를 입력해 주세요. 1-")
    switch(parseInt (number/10)) {
        case 10:
        case 9:
        alert("A 입니다.");
        break;
         case 8:
        alert("B 입니다.");
        break;
         case 7:
        alert("C 입니다.");
        break;
         case 6:
        alert("D 입니다.");
        break;
         default:
        alert("F 입니다.");
        break;
    }
